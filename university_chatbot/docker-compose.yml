version: '3.8'

services:
  # The FastAPI Backend Service
  api:
    build: .
    container_name: university_chatbot_api
    command: python app.py
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./knowledge_base:/app/knowledge_base
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
    restart: unless-stopped

  # The Streamlit Frontend Service
  ui:
    build: .
    container_name: university_chatbot_ui
    command: streamlit run ui.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000/ask
    depends_on:
      - api
    restart: unless-stopped
